version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: skipthehold
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skipthehold"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@db:5432/skipthehold?schema=public
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 7d
      FRONTEND_ORIGIN: http://localhost:8080
      ANALYTICS_TIMEZONE: America/Los_Angeles
      ADMIN_EMAIL: admin@skiptheholdapp.com
      ADMIN_PASSWORD: ChangeMe123!
    ports:
      - "8080:8080"

volumes:
  postgres_data:
