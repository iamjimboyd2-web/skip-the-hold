<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Company Details | Skip the Hold</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-shell">
        <a class="brand" href="/">
          <span class="brand-mark">S</span>
          <span>Skip the Hold</span>
        </a>
        <nav class="site-nav">
          <a href="/">Home</a>
          <a href="/login.html">Login</a>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <a class="inline-link" href="/">&larr; Back to homepage</a>
        <div id="company-feedback" class="feedback"></div>

        <section class="detail-hero" id="company-card"></section>

        <section class="detail-grid">
          <article class="surface-card">
            <div class="section-heading compact">
              <p class="eyebrow">Best time to call</p>
              <h2>Hourly prediction</h2>
            </div>
            <div id="best-time-card"></div>
          </article>

          <article class="surface-card">
            <div class="section-heading compact">
              <p class="eyebrow">Report your wait</p>
              <h2>Help the next caller</h2>
            </div>
            <form id="report-form" class="stack-form">
              <label class="field">
                <span>Wait time in minutes</span>
                <input type="number" id="wait-minutes" min="1" max="240" required />
              </label>
              <label class="field">
                <span>Notes (optional)</span>
                <textarea id="wait-notes" rows="4" maxlength="500" placeholder="Billing queue, support transfer, disconnected once..."></textarea>
              </label>
              <button class="primary-button" type="submit">Submit report</button>
              <p id="report-feedback" class="feedback"></p>
            </form>
          </article>
        </section>

        <section class="section-heading compact top-gap">
          <p class="eyebrow">Recent reports</p>
          <h2>Latest crowd-sourced wait times</h2>
        </section>
        <div id="recent-reports" class="report-list"></div>
      </div>
    </main>

    <script type="module" src="/js/company.js"></script>
  </body>
</html>
